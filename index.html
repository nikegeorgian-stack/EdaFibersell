function updateCookDisplay() {
  const ds=toDateStr(cookCurrentDate);
  const dayEntries = getEntriesForDate(ds);
  const mc = dayEntries.reduce((s, e) => s + e.meat, 0);
  const vc = dayEntries.reduce((s, e) => s + e.vegan, 0);
  document.getElementById('cook-date').textContent = formatAppDate(cookCurrentDate, 'full');
  document.getElementById('cook-meat-count').textContent=mc;
  document.getElementById('cook-vegan-count').textContent=vc;
  const grouped={};
  dayEntries.forEach(e=>{
    if(!grouped[e.employee_name])grouped[e.employee_name]={meat:0,vegan:0};
    grouped[e.employee_name].meat += e.meat;
    grouped[e.employee_name].vegan += e.vegan;
  });
  const monthStr = `${cookCurrentDate.getFullYear()}-${String(cookCurrentDate.getMonth() + 1).padStart(2,'0')}`;
  const monthFin = getMonthOrderFinance(monthStr);
  const dayCount = dayEntries.reduce((s, e) => s + e.meat + e.vegan, 0);
  document.getElementById('cook-day-orders').textContent = dayCount;
  document.getElementById('cook-day-money').textContent = fmtMoney(dayCount * 10);
  document.getElementById('cook-month-orders').textContent = monthFin.portions;
  document.getElementById('cook-month-money').textContent = fmtMoney(monthFin.total);
  const det=document.getElementById('cook-details');
  const keys=Object.keys(grouped);
  if(!keys.length){det.innerHTML=`<p style="color:var(--gray-400);font-size:14px;">${t('no_orders_day')}</p>`;return;}
  det.innerHTML=keys.sort().map(n=>{
    const c=grouped[n];
    let b='';
    if(c.meat)b+=`<span style="background:var(--red-light);color:var(--red);padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;">🍖 ${c.meat}</span>`;
    if(c.vegan)b+=`<span style="background:var(--green-light);color:var(--green);padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;${c.meat?'margin-left:4px':''}">🥬 ${c.vegan}</span>`;
    const dispN=empDisplayName(n);
    return `<div class="cook-detail-item"><span style="font-weight:700;">${dispN}</span><span>${b}</span></div>`;
  }).join('');
}

function hasRecentOrders(name) {
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-2); cutoff.setHours(0,0,0,0);
  return orderEntries.some(e=>e.employee_name===name&&(e.meat+e.vegan)>0&&new Date(e.order_date+'T00:00:00')>=cutoff);
}

function renderEmpList(ov) {
  const c=ov.querySelector('#emplist');
  c.innerHTML=employees.map(emp=>{
    const hp=!!employeePasswords[emp], hr=hasRecentOrders(emp);
    return `<div class="emp-item">
      <div class="emp-info">
        <p>${empDisplayName(emp)}</p>
        <p>${hp?t('pwd_set'):t('pwd_not_set')}${hr?' · <span style="color:#d97706;font-size:11px;">'+t('recent_warn')+'</span>':''}</p>
      </div>
      <div class="emp-actions">
        <button class="btn btn-outline" data-e="${emp}" data-a="edit">✏️</button>
        <button class="btn btn-amber" data-e="${emp}" data-a="reset">🔄</button>
        <button class="btn btn-danger" data-e="${emp}" data-a="del" ${hr?'disabled':''}>🗑️</button>
      </div>
    </div>`;
  }).join('');
  c.querySelectorAll('[data-a]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const emp=btn.dataset.e, act=btn.dataset.a;
      if(act==='edit') showEditEmpModal(emp,ov);
      else if(act==='reset') {
        delete employeePasswords[emp];
        clearEmployeeAuth(emp);
        savePasswords().then(()=>{ renderEmpList(ov); notify(t('ok_pwd_reset')); }).catch(()=>{});
      }
      else if(act==='del') {
        if(hasRecentOrders(emp)){notify(t('err_cant_delete'));return;}
        employees.splice(employees.indexOf(emp),1);
        delete employeeNamesKa[emp];
        delete employeePasswords[emp];
        clearEmployeeAuth(emp);
        Promise.all([saveEmployees(), savePasswords()]).then(()=>{
          populateEmployeeSelect(); populateEmployeeFilter();
          renderEmpList(ov); notify(t('ok_emp_deleted'));
        }).catch(()=>{});
      }
    });
  });
}

  } else {
    employees.push(...DEFAULT_EMPLOYEES);
    Object.assign(employeeNamesKa, DEFAULT_EMPLOYEE_NAMES_KA);
    saveEmployees().catch(() => {});
  }
  const savedLang = localStorage.getItem(LS_LANG_KEY);
  if (savedLang === 'ka' || savedLang === 'ru') {
    lang = savedLang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }
  applyTranslations();
  populateEmployeeSelect();
  updateQuickDayLists();
  const mm = document.getElementById('manager-month');
  if (mm) mm.value = new Date().toISOString().slice(0, 7);

  const savedEmp = localStorage.getItem(LS_EMPLOYEE_KEY);
  if (savedEmp && employees.includes(savedEmp)) {
    document.getElementById('employee-select').value = savedEmp;
    handleEmployeeSelect(savedEmp);
  }
});
</script>
</body>
</html>
